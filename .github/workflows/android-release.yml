name: Build & Publish Android APK Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate Android project & prepare gradlew
        run: |
          PROJECT_DIR="."
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            fi
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Detected Android project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK and version.json manifest
        run: |
          mkdir -p release_assets
          APK_PATH=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Debug APK not found!"
            exit 1
          fi
          cp "$APK_PATH" release_assets/app-debug.apk

          BUILD_NUM=${{ github.run_number }}
          cat <<EOF > release_assets/version.json
          {
            "versionCode": $BUILD_NUM,
            "versionName": "1.0.$BUILD_NUM",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk",
            "releaseNotes": "Build #$BUILD_NUM - Govt. ITI Ranni EMech Attendance"
          }
          EOF

      - name: Publish app-debug.apk and version.json to latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK Build (${{ github.run_number }})
          prerelease: false
          files: |
            release_assets/app-debug.apk
            release_assets/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
