name: Build & Publish Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --no-daemon
          fi
          chmod +x ./gradlew
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ./gradlew assembleDebug --no-daemon

      - name: Generate version.json manifest for in-app updater
        id: meta
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts | head -n 1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          REPO="${{ github.repository }}"
          cat <<EOF > version.json
          {
            "versionCode": ${VERSION_CODE:-1},
            "versionName": "${VERSION_NAME:-1.0}",
            "apkUrl": "https://github.com/${REPO}/releases/latest/download/app-debug.apk",
            "changelog": "Automated build from commit ${GITHUB_SHA::7} — Late Grace Quick-Mark Table, accurate attendance %, Mon-Fri duty rotation, Shop Floor logout scans, Fingerprint unlock & role dashboards."
          }
          EOF
          cat version.json

      - name: Publish app-debug.apk and version.json to 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Govt. ITI Ranni EM — Latest Build"
          body: "Latest automated build for Govt. ITI Ranni Electronics Mechanic Attendance & Out-Pass Android App."
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
