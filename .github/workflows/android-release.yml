name: Build & Publish Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ESP_SECRET: ${{ secrets.ESP_SECRET || 'EMECH_KEY_2026' }}
  NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Android project & grant gradlew permission
        id: locate
        run: |
          set -e
          PROJECT_DIR="."
          GRADLEW_PATH=$(find . -maxdepth 4 -name "gradlew" -type f | head -n 1 || true)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            chmod +x "$GRADLEW_PATH"
            echo "Found gradlew at $GRADLEW_PATH"
          else
            BUILD_FILE=$(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) -type f | head -n 1 || true)
            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
            echo "gradlew not found — using system gradle in $PROJECT_DIR"
            sudo apt-get update -y && sudo apt-get install -y gradle
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          ls -la "$PROJECT_DIR"

      - name: Build Debug APK
        run: |
          set -e
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          if $GRADLE_CMD tasks --all | grep -q ":app:assembleDebug"; then
            $GRADLE_CMD :app:assembleDebug --no-daemon
          elif $GRADLE_CMD tasks --all | grep -q "assembleDebug"; then
            $GRADLE_CMD assembleDebug --no-daemon
          else
            echo "assembleDebug not found. Available tasks:"
            $GRADLE_CMD tasks --no-daemon
            exit 1
          fi

      - name: Generate version.json manifest for in-app updater
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          APK_PATH=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" ./app-debug.apk

          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk"

          cat <<EOF > ./version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${DOWNLOAD_URL}",
            "espKeyConfigured": true
          }
          EOF

      - name: Publish app-debug.apk and version.json to "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ./app-debug.apk
            ./version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send build status notification
        if: always()
        env:
          WEBHOOK_URL: ${{ env.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            MSG="EMech APK Build #${{ github.run_number }} (${{ github.repository }}) status: ${{ job.status }}"
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"${MSG}\"}" \
              "$WEBHOOK_URL" || true
          else
            echo "NOTIFY_WEBHOOK_URL not set; skipping external webhook notification."
          fi
          
