name: Build & Publish Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Debug APK
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "gradlew not found in repository"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          chmod +x "$GRADLEW_PATH"
          (cd "$PROJECT_DIR" && ./gradlew assembleDebug --no-daemon)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate version.json manifest for in-app updater
        id: meta
        run: |
          GRADLE_FILE="$PROJECT_DIR/app/build.gradle.kts"
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' "$GRADLE_FILE" | head -n 1)
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$GRADLE_FILE" | head -n 1)
          REPO="${{ github.repository }}"
          cat <<EOF > version.json
          {
            "versionCode": ${VERSION_CODE:-1},
            "versionName": "${VERSION_NAME:-1.0}",
            "apkUrl": "https://github.com/${REPO}/releases/latest/download/app-debug.apk",
            "changelog": "Automated build from commit ${GITHUB_SHA::7} — Late Grace Quick-Mark Table, accurate attendance %, Mon-Fri duty rotation, Shop Floor logout scans, Fingerprint unlock & role dashboards."
          }
          EOF
          cat version.json

      - name: Publish app-debug.apk and version.json to 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Govt. ITI Ranni EM — Latest Build"
          body: "Latest automated build for Govt. ITI Ranni Electronics Mechanic Attendance & Out-Pass Android App."
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
