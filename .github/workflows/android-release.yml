name: Build & Publish Android APK Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            echo "PROJECT_DIR=android" >> "$GITHUB_ENV"
          else
            echo "No gradlew found at root or ./android. Listing root:"
            ls -la
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Generate consistent debug.keystore
        run: |
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Locate APK and generate version.json manifest
        id: artifact
        run: |
          if [ "$PROJECT_DIR" = "." ]; then
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          else
            APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -f "$APK_PATH" ]; then
            echo "APK not found at $APK_PATH"
            find . -name "*.apk"
            exit 1
          fi

          VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          cat > version.json <<EOF
          {
            "versionCode": ${GITHUB_RUN_NUMBER},
            "versionName": "${VERSION_NAME}",
            "apkName": "app-debug.apk"
          }
          EOF

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Publish app-debug.apk and version.json to 'latest' GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          make_latest: true
          files: |
            ${{ steps.artifact.outputs.apk_path }}
            version.json
            
