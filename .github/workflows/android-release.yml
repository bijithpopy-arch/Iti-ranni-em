name: Build & Publish Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ESP_SECRET: ${{ secrets.ESP_SECRET || 'EMECH_KEY_2026' }}
  NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android project & grant gradlew permission
        id: locate
        run: |
          set -e
          PROJECT_DIR="."
          SETTINGS_FILE=$(find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -type f | head -n 1 || true)
          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Resolved Android root: $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "has_wrapper=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_wrapper=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        if: steps.locate.outputs.has_wrapper == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure debug.keystore exists
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          set -e
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Generate version.json manifest for in-app updater
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          APK_PATH=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" ./app-debug.apk

          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk"

          cat <<EOF > ./version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${DOWNLOAD_URL}",
            "espKeyConfigured": true
          }
          EOF
          cat ./version.json

      - name: Publish app-debug.apk and version.json to "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ./app-debug.apk
            ./version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send build status notification
        if: always()
        env:
          WEBHOOK_URL: ${{ env.NOTIFY_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            MSG="EMech APK Build #${{ github.run_number }} (${{ github.repository }}) status: ${{ job.status }}"
            curl -s -X POST -H "Content-Type: application/json" \
              -d "{\"text\":\"${MSG}\"}" \
              "$WEBHOOK_URL" || true
          else
            echo "NOTIFY_WEBHOOK_URL not set; skipping external webhook notification."
          fi
          
