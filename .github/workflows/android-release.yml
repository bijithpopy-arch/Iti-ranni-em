name: Build & Publish Android APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ESP_SECRET: ${{ secrets.ESP_SECRET || 'EMECH_KEY_2026' }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Android project & grant gradlew permission
        id: locate
        run: |
          set -e
          PROJECT_DIR="."
          if [ ! -f "./gradlew" ]; then
            FOUND_GRADLEW=$(find . -maxdepth 3 -name "gradlew" -type f | head -n 1 || true)
            if [ -n "$FOUND_GRADLEW" ]; then
              PROJECT_DIR=$(dirname "$FOUND_GRADLEW")
            fi
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
          else
            echo "gradlew not found at $PROJECT_DIR — installing Gradle CLI fallback"
            sudo apt-get update -y && sudo apt-get install -y gradle
          fi

      - name: Build Debug APK
        run: |
          set -e
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Generate version.json manifest for in-app updater
        id: manifest
        run: |
          set -e
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          APK_PATH=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" ./app-debug.apk

          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/latest/app-debug.apk"

          cat <<EOF > ./version.json
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "${DOWNLOAD_URL}",
            "espKeyConfigured": true
          }
          EOF
          cat ./version.json

      - name: Publish app-debug.apk and version.json to "latest" GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ./app-debug.apk
            ./version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
