name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Android project directory
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> $GITHUB_ENV
          else
            SUBDIR=$(find . -maxdepth 2 \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1 | xargs dirname)
            echo "PROJECT_DIR=$SUBDIR" >> $GITHUB_ENV
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore or generate persistent debug keystore
        id: keystore_cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_DIR }}/debug.keystore
          key: emech-persistent-debug-keystore-v1

      - name: Generate debug keystore (first run only)
        if: steps.keystore_cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          validate-wrappers: false

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          
